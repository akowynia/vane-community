services:
  vane-community:
    image: vane-community:latest
    build:
      context: .
    ports:
      - '3000:3000'
    env_file:
      - path: .env
        required: false
    volumes:
      - data:/home/vane-community/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

volumes:
  data:
    name: 'vane-community-data'
